# Custom_Clash_Lite_Test.ini 的配套基础模板
# subconverter 负责写入 proxies、其余 proxy-groups 和 rules；
# 本文件预置需要完整 Mihomo 参数的策略组和 MRS rule-providers。

proxies: []
proxy-groups:
  # subconverter 的 INI 组语法无法完整输出 timeout、max-failed-times 等字段，
  # 因此在基础模板中原生定义，并由 Mihomo 动态加载全部非香港节点。
  - name: "🛟 故障转移"
    type: fallback
    include-all-proxies: true
    exclude-type: "Direct"
    exclude-filter: '(?i)(🇭🇰|香港|港|HK|HKG|Hong[ _-]?Kong|九龙|Kowloon|新界|沙田|荃湾|葵涌)'
    url: "https://www.gstatic.com/generate_204"
    interval: 60
    timeout: 1000
    max-failed-times: 1
    lazy: true
    expected-status: 204
rules: []

rule-providers:
  GeoSite_Private:
    type: http
    behavior: domain
    format: mrs
    path: ./rule_provider/GeoSite_Private.mrs
    url: https://cdn.jsdelivr.net/gh/levi882/v2ray-rules-dat@release/mrs/geosite/private.mrs
    interval: 86400

  GeoIP_Private:
    type: http
    behavior: ipcidr
    format: mrs
    path: ./rule_provider/GeoIP_Private.mrs
    url: https://cdn.jsdelivr.net/gh/levi882/v2ray-rules-dat@release/mrs/geoip/private.mrs
    interval: 86400

