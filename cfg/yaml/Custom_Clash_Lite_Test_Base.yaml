# Custom_Clash_Lite_Test.ini 的配套基础模板
# 需配合支持同名 Base 参数叠加的 SubConverter-Extended fork。
# 策略组顺序和节点成员由 INI 决定；这里仅补充 INI 无法表达的 Mihomo 参数。

proxies: []
proxy-groups:
  # 同名 INI 组会从全部 proxy-provider 加载具体节点，并继承这里的高级参数。
  - name: "🛟 故障转移"
    type: fallback
    exclude-filter: '(?i)(🇭🇰|香港|港|HK|HKG|Hong[ _-]?Kong|九龙|Kowloon|新界|沙田|荃湾|葵涌)'
    url: "https://www.gstatic.com/generate_204"
    interval: 60
    timeout: 1000
    max-failed-times: 1
    lazy: false
    expected-status: 204

rules: []

rule-providers:
  GeoSite_Private:
    type: http
    behavior: domain
    format: mrs
    path: ./rule_provider/GeoSite_Private.mrs
    url: https://cdn.jsdelivr.net/gh/levi882/v2ray-rules-dat@release/mrs/geosite/private.mrs
    interval: 86400

  GeoIP_Private:
    type: http
    behavior: ipcidr
    format: mrs
    path: ./rule_provider/GeoIP_Private.mrs
    url: https://cdn.jsdelivr.net/gh/levi882/v2ray-rules-dat@release/mrs/geoip/private.mrs
    interval: 86400

  GeoSite_Google_CN:
    type: http
    behavior: domain
    format: mrs
    path: ./rule_provider/GeoSite_Google_CN.mrs
    url: https://cdn.jsdelivr.net/gh/levi882/v2ray-rules-dat@release/mrs/geosite/google-cn.mrs
    interval: 86400

  GeoSite_Category_Games_CN:
